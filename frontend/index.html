<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Apply saved or system appearance before the app and stylesheet paint.
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("learnhub-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {}
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0c0c0c" : "#fafafa";
      })();
    </script>
    <meta
      name="description"
      content="学习坊 LearnHub：从第一行代码开始，用免费的双语课程开启编程之旅。"
    />
    <title>LearnHub · 学习坊</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
